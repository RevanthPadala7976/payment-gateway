spring.application.name=payment-gateway

# 1. Database Connection
# Note: port is 5433 (Docker) and sslmode=disable is CRITICAL
spring.datasource.url=jdbc:postgresql://localhost:5433/payment_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}

# 2. Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 3. Hibernate (The Table Creator)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# 3. Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest

# Resilience4j Circuit Breaker: primaryBank
# Number of requests to track in the sliding window
resilience4j.circuitbreaker.instances.primaryProvider.sliding-window-size=10

# Trip the circuit if 50% or more of requests fail in the window
resilience4j.circuitbreaker.instances.primaryProvider.failure-rate-threshold=50

# How long the circuit breaker stays OPEN before testing recovery (Half-Open)
resilience4j.circuitbreaker.instances.primaryProvider.wait-duration-in-open-state=5s

# Number of trial requests allowed in HALF_OPEN state
resilience4j.circuitbreaker.instances.primaryProvider.permitted-number-of-calls-in-half-open-state=3

# Slow call detection: treat calls exceeding 1s as slow, trip if 50% are slow
resilience4j.circuitbreaker.instances.primaryProvider.slow-call-duration-threshold=1000ms
resilience4j.circuitbreaker.instances.primaryProvider.slow-call-rate-threshold=50

# Automatically transition from OPEN to HALF_OPEN once wait-duration elapses
resilience4j.circuitbreaker.instances.primaryProvider.automatic-transition-from-open-to-half-open-enabled=true







